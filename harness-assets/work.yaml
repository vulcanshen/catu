      收到就刪掉、以 128+訊號編號結束；開畫面前不再接（signal.Stop）：開著畫面時 SIGHUP 由 tgo 接、SIGINT 與 SIGTERM 由 Bubble Tea 接，Run 照常回來，結束後刪；印的時候寫 stdout 得到 EPIPE（catu | head）也是刪掉、什麼都不說、結束碼 141
