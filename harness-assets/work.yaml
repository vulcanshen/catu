      不認得的：stderr 印 catu: unknown format "<格式>"，結束碼 2；-l 後面沒有格式、或路徑不是 - 時用 -l：印原因加用法，結束碼 2
      stdout 不是終端機、格式不是 Markdown 或 mermaid 時：stdin 原樣整個複製到 stdout，一個 byte 不改、不限大小，跟 cat 一樣
      其他時候（開畫面、-p、要畫的格式）：stdin 的前 16 MB 寫進系統暫存目錄（$TMPDIR）底下每次執行建的 catu-* 目錄裡的 stdin.<格式的副檔名>（ui.Spool），照讀一個檔案一樣讀它（種類、顏色、tab 都照檔案），
