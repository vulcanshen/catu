tasks:
  - id: 1
    spec: 21
    implementation: |
      單畫面（tgo Screen，名字 View）、一個 panel [1]；panel 的 body 是 catu 自己的 reader（tgo Body）
      沒有 statusbar（不設 tgo App.Status），panel 從最上面一列開始
      每個檔最後一個 tab 是 META（internal/ui/meta.go）：四列 TYPE、SIZE、MODIFIED、MODE，label Blue、值 Text（外面來的字照 Escape），label 欄 8 格再隔兩格；
      TYPE 是 text（Markdown、mermaid 也是）、private key、image、PDF、archive、binary、directory，symlink 是 link → <os.Readlink 的目標>；
      SIZE 是 1024 進位、一位小數（目錄是 N items，1 item，不算 . 開頭的，讀不到寫 —）；MODIFIED 是 YYYY-MM-DD HH:MM；MODE 是 ls -l 的寫法；
      symlink 的 SIZE、MODIFIED、MODE 是目標的（os.Stat）；不畫行號；太長的值照 viewer 折行（列不是 Fixed），不截；找字、Visual 跟其他 tab 一樣
      panel 的 label 是內容的種類：TEXT、DIRECTORY、ARCHIVE、PDF、IMAGE、BINARY、PRIVATE KEY
      panel 裡第一列是位置列（tgo Panel.Location 畫）：看的東西的完整路徑，家目錄寫成 ~，Lavender，太長從前面截，名稱裡的控制字元畫成名字；
      不捲，空狀態與 panel.15 的錯誤上面也留著，panel 沒有焦點時跟著變暗（tgo 做）
      下框 hint：h|l:tab o:open /:search v:visual（每個檔都有 META，至少兩個 tab，h|l:tab 由 tgo 加在前面；其他是 tgo Action.Hint）；footer 由 tgo 畫：Space:menu ?:help !:log q:quit
      內容一行也沒有時，位置列下面置中畫空狀態（tgo EmptyState：Overlay0，照 panel 寬折行）：空檔案 Empty file / Press [o] to open another file，
      空目錄 Empty directory / Press [o] to open a file，空壓縮檔 Empty archive / Press [o] to open another file
      最低尺寸 40×12（tgo App.MinWidth、MinHeight）
      q 與 Ctrl-C：tgo App.Quit 不設，直接離開；有 popup 開著時 tgo 先問
      L4 的畫面測試（tdptest 每一格畫面都量；icon 與 powerline 符號各跑 1/1、2/1、2/2 格，tdptest.EachIconWidth）：
      版面在 40×12、80×24、120×40 量；tdptest.Check 走第一次啟動，在最低尺寸、60×32、80×24、120×40、300×50、比最低尺寸少一欄或一列、
      80×5、80×2、80×1、1×1 開 Space menu、global operation popup、App Log、key reference；catu 自己開的 popup（搜尋的 input popup、
      Info toast、file-picker、OPEN FAILED 的 error popup、splash、MOVE ASIDE 的 confirm）各在 80×24 打開，開著把終端機改成比它窄（50×24：
      在 80 欄打開的搜尋 input popup 寬 78）、比它矮（80×12：在 24 列打開的 file-picker 高 22）、兩邊都小（50×12），都在最低尺寸以上、popup 疊在畫面上；
      再改成最低尺寸 40×12、比它小（39×12、80×5、1×1，只畫三列，tdp screen.7），最後改回 80×24：每一格都滿寬、不當掉；popup 自己的框由 tgo 測（tdp E8）
    test: [TestScreenShowsAFile, TestMetaTab, TestQuitAtOnce, TestEmptyFile, TestEmptyDirectory, TestEmptyArchive, TestFirstLaunch, TestOwnPopupsEverySize]
  - id: 2
    spec: 13
    implementation: |
      cmd/catu/main.go：
      catu <路徑>：打開那個檔案或目錄；沒給路徑是 .（目前的目錄）；沒給路徑而 stdin 不是終端機時是 -（task 15）；兩個以上照 task 16
      catu version、-v、--version：印版本（internal/version.Display）；catu help、-h、--help：印用法，寫明檔名叫 version、help 時打 ./version
      - 開頭的不認得的旗標（-p、--print、-l、--lang 以外）：stderr 印 catu: unknown flag "<旗標>" 加用法，結束碼 2
      路徑 stat、讀不到（ui.Open 回錯誤）：不開畫面，stderr 印 catu: <路徑>: <原因>（no such file or directory、permission denied，其他照系統的字），結束碼 1
      啟動時（tgo App.Start）App Log 記 Info「Opened <路徑，家目錄寫成 ~>」
    test: [TestVersionAndHelp, TestPathNotThere, TestPathNotReadable, TestBadArguments, TestOpenLogsWhatItOpened, TestOpenErrors]
  - id: 3
    spec: 9
    implementation: |
      文字檔（前 64 KB 沒有 NUL、是合法的 UTF-8）：label TEXT；整個檔讀進來，最多 16 MB，超過時最後一列 Overlay0「(<大小> more not shown)」
      每一行左邊畫行號：靠右，欄寬 max(3, 總行數的位數)，Overlay0，後面空一格；一行比 panel 寬時在空白處折到下一列（照 tgo viewer 的 foldAt：
      空白後、寬字前後可以斷，一個字比一列長才照格子切），折下來的列行號欄空白
      語法顏色：tgo 的 terminu.Syntax（檔案的路徑當語言），跟 o 選檔的預覽同一套：catppuccin-mocha 的顏色、粗體、斜體與底線（Markdown 的 **粗體**
      粗體、*斜體* 斜體，行首的也是；註解斜體；= && 這類運算子粗體），不上背景色；chroma 漏掉的照 tdp file-picker.3 的表補（TOML 的表名 Mauve、
      key Blue，YAML 沒引號的值 Green，Makefile define 區塊裡的行……）；格式由 lib 看檔名、同名的再看資料夾（.ssh/config 是 SSH config、
      .git/config 是 Git config、/etc/hosts 是 hosts 檔，別處的 hosts 是 Text）；認不出的是 Text
      檔案的行原樣交給 Syntax，拿回同樣多行，Tab 與一行裡的 \r 留在原位，由 catu 照下面畫
      Tab 畫成 input_tab_width 格空白（複製時是 \t）；CRLF 的 \r 不畫；一行裡的 \r 回到行首、後面的字蓋過去（只留最後的狀態）；
      其他控制字元畫成 Red 的名字（\x07、\x1b……）
      檔案裡有 \x1b[ 時：照檔案自己的 SGR 上色（粗體、斜體、底線、刪除線、16 色換成 catppuccin 的、256 色、24 位元），不再上語法顏色；
      不是 SGR 的序列，ESC 畫成 Red 的 \x1b、後面的字照原樣
      超過 64 KB 的檔：先全部用 Text 畫出來，tgo Panel.Loading 打開（膠囊後面的 loading icon）；上色在背景跑（tea.Cmd），
      回來時（tgo App.OnMsg）只換掉那一個 view 的行的顏色，捲動位置、命中、Visual 的游標都不動，loading icon 拿掉；已經換成別的檔案時丟掉
    test: [TestTextFoldsALongLine, TestTextColours, TestTextTabsAndControlCharacters, TestTextOwnColourCodes, TestTextTooBig, TestTricky, TestBigTextColouredLater, TestTOMLKeysAndTables, TestYAMLValuesAsThePreview, TestCarriageReturnKeepsTheLines, TestBoldAndItalicAsThePreview, TestFormatByDirectory]
  - id: 4
    spec: 9
    implementation: |
      種類照 tdp file-picker.3 判斷：壓縮檔（.zip .tar .tar.gz .tgz .tar.bz2 .tbz2）、圖片（.png .jpg .jpeg .gif .bmp .webp .tiff .tif .ico .avif .heic）、
      PDF（.pdf）、文字、私鑰（第一行是私鑰的標頭）、其他是二進位
      目錄（label DIRECTORY）：三層的樹，第一層不畫樹枝，第二層起縮兩格、用 ├─ └─ │ 連起來（Overlay0）；目錄在前、檔案在後，各自照名字不分大小寫排；
      目錄 nf-md-folder（U+F024B）Blue，檔案 nf-md-file（U+F0214）Text，名字裡的控制字元畫成 Red 的名字；不列 . 開頭的；超過 5000 列最後一列 Overlay0 的 …
      壓縮檔（label ARCHIVE）：裡面的路徑排成同樣的樹
      PDF（label PDF）：第一列 Overlay0「N pages」（1 page），空一列，接前 20 頁的文字（最多 128 KB，空白行不畫）；抽不出字寫 (no extractable text)
      圖片（label IMAGE）：第一列 Overlay0「data:image/png · <大小>」，空一列，接 base64 的 data URI（一行，照 panel 寬折）；超過 1 MB 寫「(<大小> — too large to inline as a data URI)」
      其他（label BINARY）：一列 8 bytes 的十六進位（Text，每個 byte 後面一格）、空兩格、ASCII（Overlay0，不可見的字寫 .），一列 33 格；最多前 1 MB，
      超過時最後一列 Overlay0「(<大小> more not shown)」
      檔案打得開、內容讀不出來時（壞掉的壓縮檔、PDF，讀到一半出錯的圖片、二進位）：label 照種類，panel 中間照空狀態的樣子寫兩句（tgo Panel.Fail 畫），
      Red「Can't read this archive|PDF|image|file: <原因>」、Overlay0「Press [o] to open another file」；App Log 在 Info「Opened <路徑>」後面記 Error，同一句話
      目錄樹、十六進位、PDF、圖片不畫行號
      hide_secrets_in_preview 不管 panel：panel 照樣畫使用者打開的檔（私鑰、只有擁有者能讀的檔也一樣）；這個設定只交給 tgo 的 file-picker 預覽（task 8）
    test: [TestDirectoryTree, TestEmptyDirectory, TestArchiveTree, TestEmptyArchive, TestContentUnreadable, TestImageDataURI, TestPDFText, TestBinaryHex, TestBinaryTooBig, TestHideSecrets]
  - id: 5
    spec: 17
    implementation: |
      panel 上沒有游標：j|↓、k|↑ 捲一列（折行的一行一列一列捲），d|PgDn、u|PgUp 捲半頁，gg、G 到頭尾；Ctrl-U、Ctrl-D 不作用
      （PgUp、PgDn 是 u|d，跟 tgo 每一個 surface 一樣：viewer、清單、menu、表單、finder、textarea 都收，tdp K12）
      下框右邊：放不下時寫 N-M of T（最上面那一列所屬的行到最下面那一列所屬的行，總行數）
      ? 的 MOVE 區列 j|k、u|d、gg|G（tgo Body.MoveKeys），內容全放得下時不列；h|l（previous tab, next tab）由 tgo 列：每個檔都有 META，都有 tab
      v（Space menu 的 panel operation [v]isual：select text to copy；hint v:visual；沒有內容時不出現）：進 tgo 的 panel 模式 Visual（tgo Panel.EnterMode），
      游標出現在畫面第一行的行首，一格 Subtext1 底、Base 粗體（panel 的 cursor 色塊）；那一行的行號 Text
      Visual 裡：h|j|k|l（與方向鍵）、w|b|e、0|$、u|d（PgUp、PgDn）、gg|G 照 vim 移動游標（同 tgo viewer 的選取模式），走到畫面邊緣時捲動；下框右邊寫 N of M（游標所在的行）
      Visual 裡再按 v：從游標開始選，進一層 select（tgo Panel.EnterLayer，模式名 Visual>select），範圍 Yellow 底、Base 字，
      語法顏色與粗體、斜體、底線在範圍裡都不顯示
      y：複製範圍（從起點到游標，含游標那個字；Tab 照原樣是 \t；排好的列尾端的空白不複製）到終端機的剪貼簿（tgo Clipboard），離開模式，Success toast「Copied」
      Esc 一次退一層：select 裡按，範圍消失回到 Visual；Visual 裡按，游標消失離開模式；都不複製
      模式的 Space menu：Visual 的 [v] Select（from here）、select 的 Cop[y]（what is selected）在 ITEM OPERATION，移動鍵只顯示（tgo 做）
      footer 由 tgo 畫：Visual 裡 Space:menu ?:help v:select Esc:cancel，select 裡 Space:menu ?:help y:copy Esc:unselect
      進出模式不記 App Log；複製的 toast 由 tgo 記
    test: [TestScrollKeys, TestVisualSelectsAndCopies, TestVisualEscOneLayerAtATime, TestVisualMoves, TestVisualSpaceMenu, TestVisualSelectionPlain]
  - id: 6
    spec: 17
    implementation: |
      /（Space menu 的 panel operation [/] Search：find text in it；hint /:search；沒有內容時不出現）：tgo 的 text input popup，
      標題 Search、glyph nf-fa-search（U+F002）、提示 Find in <檔名>、Enter:find
      Enter：每一個找到的地方（不分大小寫）都是命中，加底線、保留原本的顏色；目前那一筆畫成 cursor 色塊（Subtext1 底、Base 粗體）；捲到看得到第一筆
      一筆都沒有時 Info toast「No line has <字>」
      從 Space menu 執行時：Enter 搜了，有沒有找到都連 Space menu 一起收起（tgo App.CloseAll：input popup 與 menu 同時播收起的動畫）；
      在 input popup 上按 Esc 回到 Space menu（tgo 預設保留 source）
      n、N（Space menu 的 [n]ext：the next place found、[N] Previous：the place found before；只在有命中時出現）：跳到下一筆、上一筆，到頭尾繞回，
      看不到時才捲到剛好看得到
      有命中時 panel 上的 Esc（tgo Panel.OnEsc）清掉命中；沒有命中時不設 OnEsc，? 不列 Esc；換檔案、換 tab 時命中跟著清掉
      找字不記 App Log；一筆都沒有時的 Info toast 由 tgo 記進 App Log，同一句話（tgo App.Toast 記每一個 toast）
      有命中時 tgo Panel.SearchStatus 是 {找的字, 目前第幾筆, 共幾筆}，tgo 畫在下框捲動位置的左邊（/needle 2 of 5）；reader 在命中變的每個地方（找、n|N、Esc、換檔案、換 tab、重排）跟著更新，沒有命中時清掉
      App Log（!）與 key reference（?）的 / 是 tgo 的（key reference 的 hint /:search ?|Esc:close），catu 不另外做
    test: [TestSearchFindsAndSteps, TestSearchNoHit, TestSearchHitsDrawn, TestSearchFromTheSpaceMenu]
  - id: 7
    spec: 17
    implementation: |
      o（Space menu 的 panel operation [o]pen：another file；hint o:open）：tgo 的 file-picker，標題 Open、glyph nf-md-file_find（U+F0DCF）；
      根目錄是正在看的檔案所在的目錄、cursor 停在它上面（Green）；看的是目錄時根目錄就是那個目錄
      選了一個檔案（Enter）：先讀（tgo FilePicker.Commit）；讀得到就換成看它、label、tab 與位置列跟著換、回到最上面，App Log 記 Info「Opened <路徑>」，
      連打開它的 Space menu 一起收起（tgo App.CloseAll，file-picker 與 menu 同時播收起的動畫）
      選的是正在看的那一個（值跟打開時一樣）：不讀、不換，tgo 直接關掉 file-picker；從 Space menu 打開時回到 Space menu；App Log 不記
      讀不到：file-picker 留著，tgo 在上面開 error popup（OPEN FAILED，寫原因），Enter|Esc 關掉回到 file-picker；原本看的內容不動；
      tgo 在 App Log 記 Error「Open failed: <原因>」
      從 Space menu 打開時，在 file-picker 上按 Esc 回到 Space menu（tgo 預設保留 source）
    test: [TestOpenAnotherFile, TestOpenFromTheSpaceMenu, TestOpenUnreadable, TestOpenTheSameFile, TestOpenFromADirectory]
  - id: 8
    spec: 8
    implementation: |
      讀 <設定目錄>/config.yaml：設定目錄是 CATU__CONFIG，沒有就 $XDG_CONFIG_HOME/catu，再沒有就 ~/.config/catu；檔案不在就用預設值，catu 不寫它
      input_tab_width（預設 4，小於 1 時用 4）：交給 tgo App.InputTabWidth，文字裡的 Tab 畫成這麼多格
      hide_secrets_in_preview（預設 false）：只交給 tgo App.HideSecretsInPreview（file-picker 的預覽），panel 不管（task 4）
      讀不了（格式錯、沒有權限）：先用預設值打開，啟動時 tgo MoveAside 開 MOVE ASIDE 的 confirm；Enter 改名成 config.yaml.bak、用預設值重讀看的檔；Esc 離開 catu，
      路徑與原因印到 stderr
      不存狀態、資料、快取
    test: [TestSettingsTabWidth, TestSettingsDirOrder, TestSettingsUnreadable, TestSettingsUnreadableQuit, TestHideSecrets]
  - id: 9
    spec: 17
    implementation: |
      檔名是 .md .markdown .mdown .mkd .mkdn 的文字檔：panel 有兩個 tab（tgo Panel.Label、Tabs），DOCUMENT（打開時在這裡）、SOURCE；h|l 切（tgo 做），
      下框 hint 前面多 h|l:tab；換 tab 時回到最上面、命中與 Visual 清掉
      SOURCE：照 task 3 的文字檔（terminu.Syntax 的 markdown 上色、行號、折行）
      DOCUMENT：goldmark（GFM：表格、刪除線、任務清單、自動連結）解析，照 panel 的寬度排成一列一列（每列剛好 panel 內寬、不畫行號、不再折），寬度變了重排；
      畫面上沒有 markdown 的符號，元件照 webu：
      層的顏色（標題與引用的直槓共用）：第 1 到第 6 層 Peach、Rosewater、Green、Teal、Flamingo、Mauve，六個都不一樣
      標題：字的前後各一格空白、整段鋪在它那一層的顏色上，字 Base 粗體；只包住字，不鋪滿整列
      段落 Text；粗體、斜體、刪除線照終端機的樣式；行內程式碼 Pink 字、Surface0 底
      無序清單每一層都是 Blue 的 -，靠縮排分層；任務清單換成 Blue 的 [x]、[ ]；有序清單依層 1.、a.、i. 輪迴，從清單寫的起始數字開始；項目折行時對齊到字的開頭
      程式碼區塊：整列 Mantle 底，照語言名上色（tgo 的 terminu.Syntax，跟 task 3 同一套，連粗體、斜體與底線，chroma 漏掉的照 tdp file-picker.3 補），語言名 Overlay0 寫在第一列右邊；Tab 畫成 input_tab_width 格；一行太長在空白處折行
      引用：開頭 ▎ 加一格空白，整列 Mantle 底；▎ 是那一層引用的顏色（第 1 層 Peach、引用裡的引用 Rosewater……），巢狀時每一條各是自己那一層的顏色，
      第 6 層之後顏色從頭輪
      連結：Sapphire 的 nf-md-link（U+F0337）加一格空白，連結的字 Sapphire 加底線；沒有字時寫網址
      圖片：Overlay0 的 nf-md-image（U+F02E9）加 alt，沒有 alt 時寫網址的檔名
      表格：Overlay0 的框線畫成格子，表頭粗體、下面一條分隔線；太寬時最寬的欄先縮，切掉的格子結尾畫 Overlay0 的 …
      分隔線：Overlay0 的 ─ 鋪滿；HTML 照原樣畫成 Overlay0；外面來的字裡的控制字元畫成 Red 的名字（顏色碼的 ESC 也是，不套它的顏色）；內文裡的 Tab 與換行畫成一個空白
      區塊之間空一列（清單裡不空）
      找字、Visual 照 task 5、6：命中與游標在排好的列上；複製的是畫面上的字，一列尾端補滿的空白不複製
      內容是空的時候照 task 1 的空狀態
    test: [TestMarkdownDocumentAndSource, TestMarkdownLaidOutAgainOnResize, TestMarkdownSearchAndCopy, TestEmptyMarkdown, TestEveryRowIsTheWidth, TestNoMarkdownSymbols, TestHeadingIsAChipOfItsLevel, TestLists, TestListItemFolds, TestCodeBlock, TestCodeBlockColoursAsThePreview, TestCodeBlockItalicComment, TestCodeLineFolds, TestQuote, TestTable, TestTableTooWide, TestLinkAndImage, TestInlineStyles, TestRule, TestControlCharacters]
  - id: 10
    spec: 12
    implementation: |
      internal/mermaid：Pele 1.13.0 的 dist/pele.global.js（MIT，LICENSE 一起放在 internal/mermaid/pele/）用 go:embed 放進執行檔，goja 跑；
      pele.render 給的 measurer 把每個字量成一格（8.4px，寬字兩格），fontSize 14，maxWidth 是可以用的格數 × 8.4，autoDirection 開著、
      directionBreakpoint 設成很大（放不下就把 LR 轉成 TB，不只在 pele 預設的 640px 以下），不畫連結與圖片；一次 render 超過 3 秒就停下來，當成錯誤
      SVG 先整個讀完再畫：rect、polygon、polyline、line、circle、ellipse、path（M L H V C S Q T A Z），套用 transform（translate、scale、rotate、matrix）；
      欄是 x ÷ 8.4 四捨五入；列不是直接除：框的上下邊、分隔線、字、線的端點這些「層」排序後一層一層分配，離上一層 0.4 列以上就是新的一列
      （隔得遠的照距離多空幾列），近的併在同一列，層與層之間照比例 —— 字不會落在線上，框裡一行字時字在正中間
      水平與垂直的線用框線字，交會處依方向選 ─ │ ╭ ╮ ╰ ╯ ├ ┤ ┬ ┴ ┼（轉角一律圓角）；虛線 ╌ ╎；
      flowchart／graph 的判斷（節點 id 後面接 {字}，不是 {{ }}、不在引號裡、後面沒有 :::）交給 pele 前改寫成 ["字"]:::catuDecision（字裡已經有引號就不加），
      pele 照方框排、線接在框邊；畫的時候那個框照一般的框畫，左右兩邊正中間的那一格換成 ◆（框的顏色），在箭頭之後放，箭頭照樣停在框線前一格；
      改寫後 pele 丟錯時用原文再排一次：錯誤訊息是使用者寫的字，只有改寫壞掉時照原文畫菱形；其他圖（class、state……）不改
      斜的直線（菱形、多邊形的邊）畫成階梯：在經過的每一列畫一段橫線，在它跨到下一列的那一欄（兩列中間的那條線上）往上或往下接一格，轉角圓角；
      不用點字（braille）：曲線（三次、二次、弧）一律畫成框線的直角轉折：照起點的方向（橫或直）出去、照終點的方向進來，
      出去與進來同一個方向時在一半的地方轉（一個框往下分好幾條線時共用同一列，像一棵樹），出去又折回來的（連回自己的線）在曲線最遠的地方轉，
      至少離開兩格或一列，箭頭放得下；
      圓與橢圓：小於兩格寬、一列高的畫 ○（填滿的 ●，○ 與 ● 疊在一起是 ◉：state 圖的開始與結束），其他畫成外接的框，是節點時左右兩邊正中間換成 ( 與 )；
      pie 圖（pele 讀得懂時）不畫 pele 的圓，自己從原文畫成一條橫條，每一列都從第二格開始：
      標題置中、空一列；一條 █ 的橫條是全部（panel 寬減四格，最多 60 格），每一塊佔它的比例那麼多格、顏色是 pele 給那一塊的（照原文順序輪流用 pele 的 8 個顏色），
      大的在前（一樣大照原文順序），不是 0 的至少一格，四捨五入剩下的格給被捨掉最多的；
      下一列是每個顏色的 ■ 與佔全部的百分比（四捨五入到整數；■ 與後面的字空一格，項目之間空兩格，tdp components.2），放不下換到下一列；
      再來一塊一列：■ 與它代表什麼（原文的字，控制字元畫成 Red 的名字，tdp components.5；太長截斷加 …），showData 時空兩格加 Subtext0 的 [值]
      箭頭（填滿的三角形 pele-marker）在所有線與字畫完後放：指向的框線前一格、框線上不留朝箭頭的接頭，沒有框線時蓋在線的最後一格，▶ ◀ ▲ ▼；
      線組成的 marker（ER 圖的鴨掌、短槓）照線畫
      字照原本的位置放（text-anchor、tspan 的每一行），邊上的字左右各清掉一格線；描邊用的字（fill none）不畫；比一格小的方塊畫 ■、小圓照上面畫 ○ ● ◉
      顏色：節點的框 Blue、群組的框與生命線 Overlay0、線與箭頭 Overlay2（或 SVG 寫的顏色）、字 Text、邊上的字 Subtext0、群組的名字 Overlay1、標題粗體
      上下空白的列、左邊空白的欄拿掉；同一張圖同一個寬度畫過就記住
      Markdown 的 ```mermaid 區塊（task 9）畫成圖；.mmd、.mermaid 檔有 DIAGRAM（打開時在這裡）、SOURCE 兩個 tab，DIAGRAM 當成一個 mermaid 區塊畫
      比 panel 寬的圖：那一列切掉，最後一格 Overlay0 的 …（task 5 的 reader）
      寫錯（pele 丟出錯誤）：Markdown 裡的區塊照程式碼區塊畫原始碼（右上角 mermaid），下面 Red 一行一列寫 pele 的錯誤；
      .mmd、.mermaid 檔的 DIAGRAM 整個 tab 沒有東西，位置列下面置中畫（reader 的 tgo Failure()：照寬度排版回錯誤時有，tgo 在同一格畫）Red 的「Can't draw this diagram: <pele 錯誤的第一行>」、空一列、
      Overlay0 的「Press [l] to see the source, [!] for the whole error」（照 panel 寬折行；寬度變了重畫一次）；切到 SOURCE 時 body 換了就沒有，切回來再排一次；
      兩種都在 App Log 記 Warning「Can't draw a mermaid diagram in <檔名>: <pele 的整段錯誤>」，同一個檔同一個錯只記一次
      打開含有 mermaid 區塊的 Markdown、或 mermaid 檔時，在背景先載入 pele
    test: [TestFlowchartLeftToRight, TestNarrowTurnsTopDown, TestEdgeLabelOnTheLine, TestSequence, TestDecisionAsABox, TestAsDecisions, TestDecisionErrorAsWritten, TestNoDots, TestPieAsOneBar, TestWideWords, TestColours, TestSyntaxError, TestBoxJoins, TestDiagram, TestDiagramError, TestMermaidInMarkdown, TestMermaidFile, TestMermaidFileCannotBeDrawn, TestMermaidTooWide, TestMermaidErrorLoggedOnce, TestWarmLoadsPele]
