tasks:
  - id: 1
    spec: 1
    implementation: |
      單畫面（tgo Screen，名字 View）、一個 panel [1]；panel 的 body 是 viewu 自己的 reader（tgo Body）
      最上面一列 statusbar（tgo App.Status）：Size: <值補到 11 格>  Modified: <YYYY-MM-DD HH:MM>  Mode: <ls -l 的寫法>，全部 Overlay0；
      目錄的 Size 是 N items（1 item，不算 . 開頭的），讀不到寫 —
      panel 的 label 是內容的種類：TEXT、DIRECTORY、ARCHIVE、PDF、IMAGE、BINARY、PRIVATE KEY
      panel 裡第一列是位置列：看的東西的完整路徑，家目錄寫成 ~，Lavender，太長從前面截（tgo TruncateLeft），名稱裡的控制字元畫成名字（tgo Escape）；不捲
      下框 hint：o:open /:search v:visual（tgo Action.Hint）；footer 由 tgo 畫：Space:menu ?:help !:log q:quit
      內容一行也沒有時，位置列下面置中畫空狀態（Overlay0，照 panel 寬折行）：空檔案 Empty file / Press [o] to open another file，
      空目錄 Empty directory / Press [o] to open a file，空壓縮檔 Empty archive / Press [o] to open another file
      最低尺寸 40×12（tgo App.MinWidth、MinHeight）
      q 與 Ctrl-C：tgo App.Quit 不設，直接離開；有 popup 開著時 tgo 先問
      L4 的畫面測試在 40×12、80×24、120×40 量，icon 與 powerline 符號各跑 1/1、2/1、2/2 格（tdptest.EachIconWidth）；tdptest.Check 走一遍第一次啟動
    test: [TestScreenShowsAFile, TestStatusbarModeAndDirectorySize, TestQuitAtOnce, TestEmptyFile, TestEmptyDirectory, TestFirstLaunch]
  - id: 2
    spec: 1
    implementation: |
      cmd/viewu/main.go：
      viewu <路徑>：打開那個檔案或目錄；沒給路徑是 .（目前的目錄）
      viewu version、-v、--version：印版本（internal/version.Display）；viewu help、-h、--help：印用法，寫明檔名叫 version、help 時打 ./version
      兩個以上的參數：stderr 印 viewu: one path at a time 加用法，結束碼 2；- 開頭的不認得的旗標：stderr 印 viewu: unknown flag "<旗標>" 加用法，結束碼 2
      路徑 stat、讀不到（ui.Open 回錯誤）：不開畫面，stderr 印 viewu: <路徑>: <原因>（no such file or directory、permission denied，其他照系統的字），結束碼 1
      啟動時（tgo App.Start）App Log 記 Info「Opened <路徑，家目錄寫成 ~>」
    test: [TestVersionAndHelp, TestPathNotThere, TestPathNotReadable, TestBadArguments, TestOpenLogsWhatItOpened, TestOpenErrors]
  - id: 3
    spec: 4
    implementation: |
      文字檔（前 64 KB 沒有 NUL、是合法的 UTF-8）：label TEXT；整個檔讀進來，最多 16 MB，超過時最後一列 Overlay0「(<大小> more not shown)」
      每一行左邊畫行號：靠右，欄寬 max(3, 總行數的位數)，Overlay0，後面空一格；一行比 panel 寬時在空白處折到下一列（照 tgo viewer 的 foldAt：
      空白後、寬字前後可以斷，一個字比一列長才照格子切），折下來的列行號欄空白
      語法顏色：tgo 的 terminu.Syntax（檔案的路徑當語言），跟 o 選檔的預覽同一套：catppuccin-mocha 只上前景色，chroma 漏掉的照
      tdp file-picker.3 的表補（TOML 的表名 Mauve、key Blue，YAML 沒引號的值 Green……）；chroma 認不出語言的檔是 Text
      一行裡有 \r 的，先換成最後的樣子再交給 Syntax（Syntax 會把它當換行，TODO(tgo #1)）
      Tab 畫成 input_tab_width 格空白（複製時是 \t）；CRLF 的 \r 不畫；一行裡的 \r 回到行首、後面的字蓋過去（只留最後的狀態）；
      其他控制字元畫成 Red 的名字（\x07、\x1b……）
      檔案裡有 \x1b[ 時：照檔案自己的 SGR 上色（粗體、斜體、底線、刪除線、16 色換成 catppuccin 的、256 色、24 位元），不再上語法顏色；
      不是 SGR 的序列，ESC 畫成 Red 的 \x1b、後面的字照原樣
      超過 64 KB、chroma 認得語言的檔：先全部用 Text 畫出來，tgo Panel.Loading 打開（膠囊後面的 loading icon）；上色在背景跑（tea.Cmd），
      回來時（tgo App.OnMsg）只換掉那一個 view 的行的顏色，捲動位置、命中、Visual 的游標都不動，loading icon 拿掉；已經換成別的檔案時丟掉
    test: [TestTextFoldsALongLine, TestTextColours, TestTextTabsAndControlCharacters, TestTextOwnColourCodes, TestTextTooBig, TestTricky, TestBigTextColouredLater, TestTOMLKeysAndTables, TestYAMLValuesAsThePreview]
  - id: 4
    spec: 1
    implementation: |
      種類照 tdp file-picker.3 判斷：壓縮檔（.zip .tar .tar.gz .tgz .tar.bz2 .tbz2）、圖片（.png .jpg .jpeg .gif .bmp .webp .tiff .tif .ico .avif .heic）、
      PDF（.pdf）、文字、私鑰（第一行是私鑰的標頭）、其他是二進位
      目錄（label DIRECTORY）：三層的樹，第一層不畫樹枝，第二層起縮兩格、用 ├─ └─ │ 連起來（Overlay0）；目錄在前、檔案在後，各自照名字不分大小寫排；
      目錄 nf-md-folder（U+F024B）Blue，檔案 nf-md-file（U+F0214）Text，名字裡的控制字元畫成 Red 的名字；不列 . 開頭的；超過 5000 列最後一列 Overlay0 的 …
      壓縮檔（label ARCHIVE）：裡面的路徑排成同樣的樹；讀不了寫 (unreadable)
      PDF（label PDF）：第一列 Overlay0「N pages」（1 page），空一列，接前 20 頁的文字（最多 128 KB，空白行不畫）；抽不出字寫 (no extractable text)；讀不了寫 (unreadable)
      圖片（label IMAGE）：第一列 Overlay0「data:image/png · <大小>」，空一列，接 base64 的 data URI（一行，照 panel 寬折）；超過 1 MB 寫「(<大小> — too large to inline as a data URI)」
      其他（label BINARY）：一列 8 bytes 的十六進位（Text）、空一格、ASCII（Overlay0，不可見的字寫 .）；最多前 1 MB，超過時最後一列 Overlay0「(<大小> more not shown)」
      目錄樹、十六進位、PDF、圖片不畫行號
      hide_secrets_in_preview 打開時：私鑰只畫第一行，下面 Overlay0「(sensitive content not shown)」，label PRIVATE KEY；group、other 都不能讀的檔只畫那一句
    test: [TestDirectoryTree, TestEmptyDirectory, TestArchiveTree, TestImageDataURI, TestPDFText, TestBinaryHex, TestBinaryTooBig, TestHideSecrets]
  - id: 5
    spec: 1
    implementation: |
      panel 上沒有游標：j|↓、k|↑ 捲一列（折行的一行一列一列捲），d|PgDn、u|PgUp 捲半頁，gg、G 到頭尾；Ctrl-U、Ctrl-D 不作用
      下框右邊：放不下時寫 N-M of T（最上面那一列所屬的行到最下面那一列所屬的行，總行數）
      ? 的 MOVE 區列 j|k、u|d、gg|G（tgo Body.MoveKeys），內容全放得下時不列
      v（Space menu 的 panel operation [v]isual：select text to copy；hint v:visual；沒有內容時不出現）：進 tgo 的 panel 模式 Visual（tgo Panel.EnterMode），
      游標出現在畫面第一行的行首，一格 Subtext1 底、Base 粗體（panel 的 cursor 色塊）；那一行的行號 Text
      Visual 裡：h|j|k|l（與方向鍵）、w|b|e、0|$、u|d（PgUp、PgDn）、gg|G 照 vim 移動游標（同 tgo viewer 的選取模式），走到畫面邊緣時捲動；下框右邊寫 N of M（游標所在的行）
      Visual 裡再按 v：從游標開始選，進一層 select（tgo Panel.EnterLayer，模式名 Visual>select），範圍 Yellow 底、Base 字
      y：複製範圍（從起點到游標，含游標那個字；Tab 照原樣是 \t；排好的列尾端的空白不複製）到終端機的剪貼簿（tgo Clipboard），離開模式，Success toast「Copied」
      Esc 一次退一層：select 裡按，範圍消失回到 Visual；Visual 裡按，游標消失離開模式；都不複製
      模式的 Space menu：Visual 的 [v] Select（from here）、select 的 Cop[y]（what is selected）在 ITEM OPERATION，移動鍵只顯示（tgo 做）
      footer 由 tgo 畫：Visual 裡 Space:menu ?:help v:select Esc:cancel，select 裡 Space:menu ?:help y:copy Esc:unselect
      進出模式不記 App Log；複製的 toast 由 tgo 記
    test: [TestScrollKeys, TestVisualSelectsAndCopies, TestVisualEscOneLayerAtATime, TestVisualMoves, TestVisualSpaceMenu]
  - id: 6
    spec: 1
    implementation: |
      /（Space menu 的 panel operation [/] Search：find text in it；hint /:search；沒有內容時不出現）：tgo 的 text input popup，
      標題 Search、glyph nf-fa-search（U+F002）、提示 Find in <檔名>、Enter:find
      Enter：每一個找到的地方（不分大小寫）都是命中，加底線、保留原本的顏色；目前那一筆畫成 cursor 色塊（Subtext1 底、Base 粗體）；捲到看得到第一筆
      一筆都沒有時 Info toast「No line has <字>」
      n、N（Space menu 的 [n]ext：the next place found、[N] Previous：the place found before；只在有命中時出現）：跳到下一筆、上一筆，到頭尾繞回，
      看不到時才捲到剛好看得到
      有命中時 panel 上的 Esc（tgo Panel.OnEsc）清掉命中；沒有命中時不設 OnEsc，? 不列 Esc；換檔案、換 tab 時命中跟著清掉
      找字不記 App Log
    test: [TestSearchFindsAndSteps, TestSearchNoHit, TestSearchHitsDrawn]
  - id: 7
    spec: 1
    implementation: |
      o（Space menu 的 panel operation [o]pen：another file；hint o:open）：tgo 的 file-picker，標題 Open、glyph nf-md-file_find（U+F0DCF）；
      根目錄是正在看的檔案所在的目錄、cursor 停在它上面（Green）；看的是目錄時根目錄就是那個目錄
      選了一個檔案（Enter）：先讀（tgo FilePicker.Commit）；讀得到就換成看它、label 與位置列與 statusbar 跟著換、回到最上面，App Log 記 Info「Opened <路徑>」，
      連打開它的 Space menu 一起收起（tgo App.CloseAll）；選同一個檔不做事
      讀不到：file-picker 留著，tgo 在上面開 error popup（OPEN FAILED，寫原因），Enter|Esc 關掉回到 file-picker；原本看的內容不動
      從 Space menu 打開時，在 file-picker 上按 Esc 回到 Space menu（tgo 預設保留 source）
    test: [TestOpenAnotherFile, TestOpenFromTheSpaceMenu, TestOpenUnreadable, TestOpenFromADirectory]
  - id: 8
    spec: 1
    implementation: |
      讀 <設定目錄>/config.yaml：設定目錄是 VIEWU__CONFIG，沒有就 $XDG_CONFIG_HOME/viewu，再沒有就 ~/.config/viewu；檔案不在就用預設值，viewu 不寫它
      input_tab_width（預設 4，小於 1 時用 4）：交給 tgo App.InputTabWidth，文字裡的 Tab 畫成這麼多格
      hide_secrets_in_preview（預設 false）：交給 tgo App.HideSecretsInPreview（file-picker 的預覽），也用在 panel 上（task 4）
      讀不了（格式錯、沒有權限）：先用預設值打開，啟動時 tgo MoveAside 開 MOVE ASIDE 的 confirm；Enter 改名成 config.yaml.bak、用預設值重讀看的檔；Esc 離開 viewu，
      路徑與原因印到 stderr
      不存狀態、資料、快取
    test: [TestSettingsTabWidth, TestSettingsUnreadable, TestSettingsUnreadableQuit, TestHideSecrets]
  - id: 9
    spec: 4
    implementation: |
      檔名是 .md .markdown .mdown .mkd .mkdn 的文字檔：panel 有兩個 tab（tgo Panel.Label、Tabs），DOCUMENT（打開時在這裡）、SOURCE；h|l 切（tgo 做），
      下框 hint 前面多 h|l:tab；換 tab 時回到最上面、命中與 Visual 清掉
      SOURCE：照 task 3 的文字檔（terminu.Syntax 的 markdown 上色、行號、折行）
      DOCUMENT：goldmark（GFM：表格、刪除線、任務清單、自動連結）解析，照 panel 的寬度排成一列一列（每列剛好 panel 內寬、不畫行號、不再折），寬度變了重排；
      畫面上沒有 markdown 的符號，元件照 webu：
      層的顏色（標題與引用的直槓共用）：第 1 到第 6 層 Peach、Rosewater、Green、Teal、Flamingo、Mauve，六個都不一樣
      標題：字的前後各一格空白、整段鋪在它那一層的顏色上，字 Base 粗體；只包住字，不鋪滿整列
      段落 Text；粗體、斜體、刪除線照終端機的樣式；行內程式碼 Pink 字、Surface0 底
      無序清單每一層都是 Blue 的 -，靠縮排分層；任務清單換成 Blue 的 [x]、[ ]；有序清單依層 1.、a.、i. 輪迴，從清單寫的起始數字開始；項目折行時對齊到字的開頭
      程式碼區塊：整列 Mantle 底，照語言名上色（tgo 的 terminu.Syntax，跟 task 3 同一套，chroma 漏掉的照 tdp file-picker.3 補），語言名 Overlay0 寫在第一列右邊；Tab 畫成 input_tab_width 格；一行太長在空白處折行
      引用：開頭 ▎ 加一格空白，整列 Mantle 底；▎ 是那一層引用的顏色（第 1 層 Peach、引用裡的引用 Rosewater……），巢狀時每一條各是自己那一層的顏色，
      第 6 層之後顏色從頭輪
      連結：Sapphire 的 nf-md-link（U+F0337）加一格空白，連結的字 Sapphire 加底線；沒有字時寫網址
      圖片：Overlay0 的 nf-md-image（U+F02E9）加 alt，沒有 alt 時寫網址的檔名
      表格：Overlay0 的框線畫成格子，表頭粗體、下面一條分隔線；太寬時最寬的欄先縮，切掉的格子結尾畫 Overlay0 的 …
      分隔線：Overlay0 的 ─ 鋪滿；HTML 照原樣畫成 Overlay0；外面來的字裡的控制字元畫成 Red 的名字
      區塊之間空一列（清單裡不空）
      找字、Visual 照 task 5、6：命中與游標在排好的列上；複製的是畫面上的字，一列尾端補滿的空白不複製
      內容是空的時候照 task 1 的空狀態
    test: [TestMarkdownDocumentAndSource, TestMarkdownLaidOutAgainOnResize, TestMarkdownSearchAndCopy, TestEmptyMarkdown, TestEveryRowIsTheWidth, TestNoMarkdownSymbols, TestHeadingIsAChipOfItsLevel, TestLists, TestListItemFolds, TestCodeBlock, TestCodeBlockColoursAsThePreview, TestCodeLineFolds, TestQuote, TestTable, TestTableTooWide, TestLinkAndImage, TestInlineStyles, TestRule, TestControlCharacters]
  - id: 10
    spec: 3
    implementation: |
      internal/mermaid：Pele 1.13.0 的 dist/pele.global.js（MIT，LICENSE 一起放在 internal/mermaid/pele/）用 go:embed 放進執行檔，goja 跑；
      pele.render 給的 measurer 把每個字量成一格（8.4px，寬字兩格），fontSize 14，maxWidth 是可以用的格數 × 8.4，autoDirection 開著、
      directionBreakpoint 設成很大（放不下就把 LR 轉成 TB，不只在 pele 預設的 640px 以下），不畫連結與圖片；一次 render 超過 3 秒就停下來，當成錯誤
      SVG 先整個讀完再畫：rect、polygon、polyline、line、circle、ellipse、path（M L H V C S Q T A Z），套用 transform（translate、scale、rotate、matrix）；
      欄是 x ÷ 8.4 四捨五入；列不是直接除：框的上下邊、分隔線、字、線的端點這些「層」排序後一層一層分配，離上一層 0.4 列以上就是新的一列
      （隔得遠的照距離多空幾列），近的併在同一列，層與層之間照比例 —— 字不會落在線上，框裡一行字時字在正中間
      水平與垂直的線用框線字，交會處依方向選 ─ │ ╭ ╮ ╰ ╯ ├ ┤ ┬ ┴ ┼（轉角一律圓角）；虛線 ╌ ╎；
      斜的直線（菱形、多邊形的邊）畫成階梯：在經過的每一列畫一段橫線，在它跨到下一列的那一欄（兩列中間的那條線上）往上或往下接一格，轉角圓角；
      曲線、圓、弧一律用點字（braille）；
      兩端都是水平（或垂直）的三次曲線畫成直角的轉折
      箭頭（填滿的三角形 pele-marker）在所有線與字畫完後放：指向的框線前一格、框線上不留朝箭頭的接頭，沒有框線時蓋在線的最後一格，▶ ◀ ▲ ▼；
      線組成的 marker（ER 圖的鴨掌、短槓）照線畫
      字照原本的位置放（text-anchor、tspan 的每一行），邊上的字左右各清掉一格線；描邊用的字（fill none）不畫；比一格小的方塊畫 ■、小圓畫 ● ○
      顏色：節點的框 Blue、群組的框與生命線 Overlay0、線與箭頭 Overlay2（或 SVG 寫的顏色）、字 Text、邊上的字 Subtext0、群組的名字 Overlay1、標題粗體
      上下空白的列、左邊空白的欄拿掉；同一張圖同一個寬度畫過就記住
      Markdown 的 ```mermaid 區塊（task 9）畫成圖；.mmd、.mermaid 檔有 DIAGRAM（打開時在這裡）、SOURCE 兩個 tab，DIAGRAM 當成一個 mermaid 區塊畫
      比 panel 寬的圖：那一列切掉，最後一格 Overlay0 的 …（task 5 的 reader）
      寫錯（pele 丟出錯誤）：照程式碼區塊畫原始碼（右上角 mermaid），下面 Red 一行一列寫 pele 的錯誤；App Log 記 Warning「Can't draw a mermaid diagram in <檔名>: <錯誤>」，
      同一個檔同一個錯只記一次
      打開含有 mermaid 區塊的 Markdown、或 mermaid 檔時，在背景先載入 pele
    test: [TestFlowchartLeftToRight, TestNarrowTurnsTopDown, TestEdgeLabelOnTheLine, TestSequence, TestDiamondAsSteps, TestCirclesAsDots, TestWideWords, TestColours, TestSyntaxError, TestBoxJoins, TestDiagram, TestDiagramError, TestMermaidInMarkdown, TestMermaidFile, TestMermaidTooWide, TestMermaidErrorLoggedOnce]
  - id: 11
    spec: 1
    implementation: |
      tgo NewSplash：mark 是 internal/ui/icon.svg（docs/icon.svg 的副本，go:embed），名稱 viewu、版本 internal/version.Display、介紹 A file viewer for the terminal
      docs/icon.svg：家族的 U 框，框裡金色的 V、I（上排）、E、W（下排），註解的順序 U、V、I、E、W
      panel 上按 V 打開；任意鍵只關掉它（tgo 做）
    test: [TestSplashIsTheIcon, TestSplash]
  - id: 12
    spec: 3
    implementation: |
      副檔名 .json 的文字檔：panel 兩個 tab，TEXT（原檔，打開時在這裡，照 task 3）、FORMATTED；h|l 切（tgo 做），下框 hint 前面多 h|l:tab
      FORMATTED：Go 的 json.Indent 縮排 2 格（key 的順序、數字的寫法照原檔，只動空白），照 task 3 上 JSON 的顏色、畫它自己的行號、折行；
      超過 64 KB 一樣先 Text、背景上色
      不是合法的 JSON：FORMATTED 沒有行，位置列下面置中畫 Red 的「Not valid JSON: line N: <encoding/json 的原因>」、空一列、Overlay0 的「Press [h] to see the file as it is」
      空的檔：FORMATTED 也是 Empty file / Press [h] to see the file as it is
      找字、Visual 照 task 5、6，在 FORMATTED 裡找的是排過版的字
    test: [TestJSONAsItIsThenFormatted, TestJSONNotValid, TestJSONFormattedSearch]
